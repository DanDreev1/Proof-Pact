<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Proof Pact Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: #0f172a;
        --muted: #94a3b8;
        --line: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at top, #111827 0, #020617 42%, #000 100%);
        color: #e5e7eb;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 20px 16px 96px;
        border-inline: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.8);
      }

      header {
        flex: 0 0 auto;
      }

      .content {
        display: flex;
        flex: 1;
        align-items: center;
        padding-block: 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .card {
        position: relative;
        overflow: hidden;
        width: 100%;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.78);
      }

      .ring {
        width: 56px;
        height: 56px;
        margin-bottom: 18px;
        border: 2px solid rgba(125, 211, 252, 0.18);
        border-top-color: #7dd3fc;
        border-right-color: #6ee7b7;
        border-radius: 999px;
        animation: spin 900ms linear infinite;
      }

      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .button {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        border-radius: 18px;
        background: #fff;
        color: #020617;
        font-weight: 700;
        text-decoration: none;
      }

      .ghost {
        background: rgba(15, 23, 42, 0.95);
        color: #fff;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Offline</p>
        <h1>This page needs connection</h1>
      </header>

      <div class="content">
        <section class="card">
          <div class="ring" aria-hidden="true"></div>
          <h2>Waiting for internet</h2>
          <p>
            Calendar, reviews, pair settings, and account pages need the server. You can still create a local proof
            recording while offline.
          </p>
          <a class="button" href="/create">Create offline proof</a>
          <a class="button ghost" href="/">Try again</a>
        </section>
      </div>
    </main>
  </body>
</html>
